name: Test CSharp
on:
  workflow_call:
    inputs:
      test-group:
        required: true
        type: string
      template-version:
        required: false
        type: string
        default: v1
      timeout-minutes:
        required: false
        type: number
        default: 15
      make-target:
        description: "Make target replacing test-csharp (v1) or test-csharpv2-aot (v2); no test report is uploaded when set"
        required: false
        type: string
        default: ""
env:
  SPEAKEASY_DEBUG: "true"
  CSHARP_TARGET: ${{ inputs.template-version == 'v2' && 'csharpv2' || 'csharp' }}
jobs:
  test-csharp:
    timeout-minutes: ${{ inputs.timeout-minutes }}
    name: Test CSharp${{ inputs.template-version == 'v2' && ' v2' || '' }} - ${{ inputs.test-group }}${{ inputs.make-target != '' && format(' ({0})', inputs.make-target) || '' }}
    runs-on: ubicloud-standard-4-ubuntu-2404
    permissions:
      contents: "read"
      actions: "read"
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Add this step to install the compatible libssl1.1
      - name: Install libssl1.1
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -4 --timeout=30 http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.0g-2ubuntu4_amd64.deb
          sudo dpkg -i libssl1.1_1.1.0g-2ubuntu4_amd64.deb
          rm libssl1.1_1.1.0g-2ubuntu4_amd64.deb
      - name: Setup dotnet
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        env:
          # Prevent "Unable to locate dotnet CLI" transient errors
          # Reference: https://github.com/dotnet/sdk/issues/44957
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: |
            5.x
            6.x
            8.x
            10.x

      - name: Verify dotnet versions installed
        run: dotnet --list-sdks
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/**/go.sum
            services/**/go.sum
      - name: Test
        env:
          SPEAKEASY_GENERATED_LICENSE: agpl-3.0-only
          USAGE_GROUP: ${{ inputs.template-version != 'v2' && 'all' || '' }}
        run: TARGET=${{ inputs.test-group }} make ${{ inputs.make-target || (inputs.template-version == 'v2' && 'test-csharpv2-aot' || 'test-csharp') }}
      - name: Test compile commands without enableFormatting
        if: inputs.template-version == 'v2' && inputs.test-group == 'secondary'
        run: go test -tags dotnet -count=1 ./internal/targetconfig/
      - name: git diff
        run: ./scripts/check-generated-diff.sh
      - name: Upload test report
        if: inputs.test-group != 'review' && inputs.make-target == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-${{ env.CSHARP_TARGET }}-${{ inputs.test-group }}-test-report
          path: ./testSDKs/sdk-${{ env.CSHARP_TARGET }}-${{ inputs.test-group }}/**/test-csharp-record.txt
          if-no-files-found: error
