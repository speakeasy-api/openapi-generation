name: Test TypeScript V2
on:
  workflow_call:
    inputs:
      test-group:
        required: true
        type: string
env:
  SPEAKEASY_DEBUG: "true"
jobs:
  test-typescriptv2:
    timeout-minutes: 30
    name: Test TypeScript v2 - ${{ inputs.test-group }}
    runs-on: ubicloud-standard-4-ubuntu-2404
    permissions:
      contents: "read"
      actions: "read"
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/**/go.sum
            zSDKs/**/go.sum
            services/**/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      # The quaternary TypeScript SDK config uses compileCommand: ["pnpm", "install"].
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.34.4

      - name: Test
        env:
          SPEAKEASY_GENERATED_LICENSE: agpl-3.0-only
        run: TARGET=${{ inputs.test-group }} NODE_OPTIONS="--experimental-global-webcrypto" make test-typescriptv2
      - name: git diff
        run: ./scripts/check-generated-diff.sh
      - name: Upload test report
        if: inputs.test-group != 'review'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-typescriptv2-${{ inputs.test-group }}-test-report
          path: ./testSDKs/sdk-typescriptv2-${{ inputs.test-group }}/test-typescript-record.txt
          if-no-files-found: error
