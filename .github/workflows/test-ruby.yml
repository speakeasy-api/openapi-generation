name: Test Ruby
on:
  workflow_call:
    inputs:
      test-group:
        required: true
        type: string
env:
  SPEAKEASY_DEBUG: "true"
jobs:
  test-ruby:
    strategy:
      fail-fast: false
      matrix:
        ruby_version: ["3.2", "4.0"]
    timeout-minutes: 20
    name: Test Ruby - ${{ inputs.test-group }} - ${{ matrix.ruby_version }}
    runs-on: ubicloud-standard-4-ubuntu-2404
    permissions:
      contents: "read"
      actions: "read"
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/**/go.sum
            zSDKs/**/go.sum
            services/**/go.sum
      - name: Test
        env:
          SPEAKEASY_GENERATED_LICENSE: agpl-3.0-only
        run: TARGET=${{ inputs.test-group }} make test-ruby
      - name: git diff
        run: ./scripts/check-generated-diff.sh
      - name: Upload test report
        if: inputs.test-group != 'review' && matrix.ruby_version == '3.2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-ruby-${{ inputs.test-group }}-test-report
          path: ./testSDKs/sdk-ruby-${{ inputs.test-group }}/test-ruby-record.txt
          if-no-files-found: error
