name: SDK Feature Matrix

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Generate and validate without publishing changes
        type: boolean
        default: true

permissions:
  contents: write

env:
  GOPRIVATE: "github.com/speakeasy-api"

jobs:
  feature-matrix:
    if: github.event_name == 'workflow_dispatch' || vars.SYNC_EXTERNAL_REPOSITORIES_ENABLED == 'true'
    name: Generate SDK Feature Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout speakeasy repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: speakeasy
          token: ${{ secrets.BOT_REPO_TOKEN }}

      - name: Checkout marketing-site repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: speakeasy-api/marketing-site
          path: marketing-site
          token: ${{ secrets.BOT_REPO_TOKEN }}

      - name: Configure git for private modules
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_REPO_TOKEN }}
        run: git config --global url."https://speakeasybot:${GITHUB_TOKEN}@github.com".insteadOf "https://github.com"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "speakeasy/go.mod"
          cache-dependency-path: |
            speakeasy/go.sum
            speakeasy/cmd/**/go.sum
            speakeasy/zSDKs/**/go.sum

      - name: Generate SDK Feature Matrix
        working-directory: speakeasy
        run: |
          go run cmd/docs/main.go -out ../marketing-site/src/content/docs/sdks/languages/maturity.mdx

      - name: Create PR against marketing-site
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: marketing-site
          token: ${{ secrets.BOT_REPO_TOKEN }}
          commit-message: "docs: update SDK Feature Matrix"
          title: "docs: update SDK Feature Matrix"
          branch: sdk-feature-matrix/update
