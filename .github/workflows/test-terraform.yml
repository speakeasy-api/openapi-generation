name: Test Terraform
on:
  workflow_call:
    inputs:
      test-group:
        required: true
        type: string
env:
  SPEAKEASY_DEBUG: "true"
jobs:
  test-terraform:
    timeout-minutes: 15
    name: Test Terraform - ${{ inputs.test-group }}
    runs-on: ubicloud-standard-4-ubuntu-2404
    permissions:
      contents: "read"
      actions: "read"
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/**/go.sum
            zSDKs/**/go.sum
            services/**/go.sum
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Test
        env:
          SPEAKEASY_GENERATED_LICENSE: agpl-3.0-only
        run: TARGET=${{ inputs.test-group }} make test-terraform
      - name: git diff
        run: ./scripts/check-generated-diff.sh
