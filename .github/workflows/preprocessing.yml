name: Preprocessing
on:
  push:
    branches:
      - main
      - hotfixes
  merge_group:
  pull_request:
    branches:
      - main
      - hotfixes
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
permissions:
  contents: read

jobs:
  permissions:
    timeout-minutes: 15
    runs-on: ubicloud-standard-2
    permissions:
      contents: "read"
      actions: "read"
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/**/go.sum
            zSDKs/**/go.sum
      - name: Run go:generate directives
        run: go generate ./...

      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; git diff; echo; echo "Unexpected difference after code generation. Run 'go generate ./...' command and commit."; exit 1)
