configVersion: 2.0.0
generation:
  sdkClassName: SDK
  usageSnippets:
    optionalPropertyRendering: withExample
  fixes:
    nameResolutionDec2023: false
    securityFeb2025: true
  tests:
    generateTests: true
    generateNewTests: false
  auth:
    hoistGlobalSecurity: false
typescript:
  inferUnionDiscriminators: true
  version: 0.0.1
  author: Speakeasy
  clientServerStatusCodesAsErrors: true
  enableMCPServer: true
  imports:
    option: openapi
    paths:
      callbacks: sdk/models/callbacks
      errors: sdk/models/errors
      operations: sdk/models/operations
      shared: sdk/models/shared
      webhooks: sdk/models/webhooks
  maxMethodParams: 5
  packageName: openapi
  responseFormat: flat
  templateVersion: v2
  defaultErrorName: SDKError
  enableReactQuery: true
  envVarPrefix: SEC
  acceptHeaderEnum: true
  multipartArrayFormat: standard
  privateIdentifierPrefix: __
  zodVersion: v3
  laxMode: lax
  forwardCompatibleUnionsByDefault: tagged-only
  flatAdditionalProperties: true
  legacyFileNaming: true
  useIndexModules: false
