configVersion: 2.0.0
generation:
  sdkClassName: SDK
  tests:
    generateTests: true
    generateNewTests: false
cli:
  version: 0.0.1
  additionalDependencies: {}
  baseErrorName: SDKError
  # classifiedErrors with no x-speakeasy-cli-errors declaration in the spec
  # keeps this variant on the pure HTTP-status classification path, so the
  # declaration-free default keeps variant-level CI coverage (primary and
  # review declare the extension).
  classifiedErrors: true
  cliName: cli
  defaultErrorName: SDKDefaultError
  envVarPrefix: CLI
  packageName: basicHttp
  serverSelectionFlag: auto
