overlay: 1.0.0
info:
  title: Add a root retry policy for CLI method-policy tests
  version: 0.0.0
  x-base-spec: ./tests/specs/uber.yaml
actions:
  - target: $
    update:
      x-speakeasy-retries:
        strategy: backoff
        backoff:
          initialInterval: 1
          maxInterval: 5
          maxElapsedTime: 30
          exponent: 1.2
        statusCodes:
          - 503
        retryConnectionErrors: false
