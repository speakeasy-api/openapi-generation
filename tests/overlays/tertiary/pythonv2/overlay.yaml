# This overlay updates a few of the examples that aren't quite compatible with pythonv2 yet
overlay: 1.0.0
info:
  title: Overlay ./tests/specs/uber.yaml => ./tests/specs/tertiary.yaml
  version: 0.0.0
actions:
  # Remove the existing example in responseBodyAdditionalPropertiesAnyPost
  - target: $.paths.*.*[?(@.operationId == 'responseBodyAdditionalPropertiesAnyPost')].requestBody.content['application/json'].examples.test.value
    remove: true
  - target: $.paths.*.*[?(@.operationId == 'responseBodyAdditionalPropertiesAnyPost')].responses['200'].content['application/json'].examples.test.value
    remove: true
  - target: $.paths.*.*[?(@.operationId == 'responseBodyAdditionalPropertiesAnyPost')].requestBody.content['application/json'].examples.test
    update:
      value: {
        "key1": "value2",
        "key2": 1, # Changed this from null to 1 as pythonv2 drops this field if it's null
        "key3": {
          "foo": "bar",
          "subkey1": {
            "foo": "bar"
          }
        },
        "key4": [ "foo", "bar" ],
        "normalField": "normal"
      }
  - target: $.paths.*.*[?(@.operationId == 'responseBodyAdditionalPropertiesAnyPost')].responses['200'].content['application/json'].examples.test
    update:
      value: {
        "json": {
          "key1": "value2",
          "key2": 1, # Changed this from null to 1 as pythonv2 drops this field if it's null
          "key3": {
            "foo": "bar",
            "subkey1": {
              "foo": "bar"
            }
          },
          "key4": [ "foo", "bar" ],
          "normalField": "normal"
        }
      }

  # Test case: request body with a 'request' property that is a $ref plus sibling fields
  # Tests flattening behavior when the wrapper has a field named 'request'
  - target: $.paths
    update:
      "/requestFieldWrapper/execute":
        post:
          summary: "Execute with request field wrapper"
          operationId: "executeRequestFieldWrapper"
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/RequestFieldWrapper"
          responses:
            "200":
              description: "Success"

  - target: $.components.schemas
    update:
      RequestFieldWrapper:
        type: object
        required:
          - conversation_id
          - message_id
          - request
        properties:
          conversation_id:
            type: string
          message_id:
            type: string
          request:
            $ref: "#/components/schemas/InnerRequest"

      InnerRequest:
        type: object
        properties:
          query:
            type: string
          context:
            type: string
