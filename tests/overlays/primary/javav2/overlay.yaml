      JvmParamLimitRequestBody:
        description: Inbound (POST body) variant — loose constraints.
        allOf:
          - $ref: "#/components/schemas/JvmParamLimitObject"
          - type: object
            properties:
              missingStr:  # optional in request, required in response
                type: string
              responseOnlyConst:  # plain string in request, const in response
                type: string
      JvmParamLimitResponseBody:
        description: Outbound (200 body) variant — strict constraints.
        allOf:
          - $ref: "#/components/schemas/JvmParamLimitObject"
          - type: object
            required:
              - missingStr
            properties:
              missingStr:
                type: string
              responseOnlyConst:
                type: string
                const: fromResponse
      JvmParamLimitError:
        description: >
          4XX error envelope wrapping the wide base. errorCode kept optional
          so the api-test-service /errors/{status_code} echo (which echoes
          the request body verbatim) doesn't fail Data deser on a missing
          required field when the test reuses JvmParamLimitRequestBody.
        allOf:
          - type: object
            properties:
              errorCode:
                type: integer
          - $ref: "#/components/schemas/JvmParamLimitObject"
  - target: $.paths
    update:
      /anything/too-many-fields:
        post:
          operationId: jvmParamLimit
          tags:
            - requestBodies
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/JvmParamLimitRequestBody"
          responses:
            "200":
              description: OK
              content:
                application/json:
                  schema:
                    title: res
                    type: object
                    properties:
                      json:
                        $ref: "#/components/schemas/JvmParamLimitResponseBody"
                    required:
                      - json
      /errors/400#jvmParamLimit:
        servers:
          - url: http://localhost:35456
        post:
          operationId: jvmParamLimitForcedError
          tags:
            - errors
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/JvmParamLimitRequestBody"
          responses:
            "200":
              description: Ok
            "400":
              description: Bad Request
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/JvmParamLimitError"
