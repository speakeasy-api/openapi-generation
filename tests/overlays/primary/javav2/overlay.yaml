overlay: 1.0.0
info:
  title: javav2 JVM 255-parameter constructor limit
  version: 0.0.0
  x-base-spec: ./tests/specs/uber.yaml
actions:
  - target: $.components.schemas
    update:
      JvmParamLimitObject:
        type: object
        description: >
          Object with 255+ properties — exceeds the JVM method-parameter cap on the all-args
          constructor that javav2 emits for model classes. The generator must fall
          back to a builder/field-injection deserialization path for over-threshold
          models without altering wire behavior.
        required:
          - requiredStr
          - requiredConstStr
          - requiredNullableStr
          - requiredStrMap
          - my-cased_field
        additionalProperties:
          type: string
        properties:
          requiredStr:
            type: string
          requiredConstStr:
            type: string
            const: constVal
          requiredNullableStr:
            type:
              - string
              - "null"
          requiredStrMap:
            type: object
            additionalProperties:
              type: string
          defaultStr:
            type: string
            default: defVal
          decimal:
            type: number
            format: decimal
          decimalStr:
            type: string
            format: decimal
          bigint:
            type: integer
            format: bigint
          bigIntStr:
            type: string
            format: bigint
          stringArray:
            type: array
            items:
              type: string
          my-cased_field:
            type: string
          class:  # reserved keyword
            type: string
          closedEnum:
            $ref: "components.yaml#/components/schemas/enum"
          openEnum:
            $ref: "components.yaml#/components/schemas/enumUsedInRequestExplicitlyOpen"
          nestedObj:
            $ref: "components.yaml#/components/schemas/simpleObject"
          discUnion:
            $ref: "components.yaml#/components/schemas/stronglyTypedOneOfDiscriminatedObject"
          nonDiscUnion:
            $ref: "components.yaml#/components/schemas/weaklyTypedOneOfObject"
