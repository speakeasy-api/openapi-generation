openapi: 3.1.0
security:
  - apiKeyAuth: []
  - oauth2: []
  - clientCredentials: [read, write]
  - customSchemeAppId: []
  - basicHttp: []
  - accessToken: []
  - {}
paths:
  /test-baseurl-collision:
    post:
      operationId: testBaseURLCollision
      description: >-
        Tests that a request body property named "baseURL" does not collide
        with the SDK's internal baseURL variable used for server URL
        resolution. The generator must rename the user field to avoid the
        conflict.
      tags:
        - generation
      servers:
        - url: https://alt.example.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                baseURL:
                  type: string
      responses:
        '200':
          description: OK
