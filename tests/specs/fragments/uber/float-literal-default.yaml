openapi: 3.1.0
security:
  - apiKeyAuth: []
  - oauth2: []
  - clientCredentials: [read, write]
  - customSchemeAppId: []
  - basicHttp: []
  - accessToken: []
  - {}
paths:
  /items:
    get:
      operationId: listItems
      description: >-
        Tests that float default values (e.g. 1.0) in query parameters produce
        valid Go float literals in generated usage examples. Without
        normalization, JavaScript may stringify 1.0 as "1", yielding invalid Go
        syntax where a float literal is expected.
      tags:
        - misc
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            default: 1.0
        - name: filter
          in: query
          schema:
            type: string
            default: "status=active"
      responses:
        '200':
          description: OK
