openapi: 3.1.0
security:
  - apiKeyAuth: []
  - oauth2: []
  - clientCredentials: [read, write]
  - customSchemeAppId: []
  - basicHttp: []
  - accessToken: []
  - {}
paths:
  /anything/cli/jsonArrayFlags:
    post:
      operationId: cliJsonArrayFlagsPost
      description: >-
        Required string-item and enum-item array properties on a JSON request
        body: one with a multi-element example, one without an example, and
        one whose example is an empty array; plus an optional string-item
        array, for which an empty array is a valid value.
      tags:
        - requestBodies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CliJsonArrayFlagsRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  json:
                    $ref: "#/components/schemas/CliJsonArrayFlagsRequest"
                  url:
                    type: string
                required:
                  - url
  /anything/cli/jsonArrayFlags/query:
    get:
      operationId: cliJsonArrayFlagsGet
      description: >-
        Required string-item array query parameter with a multi-element
        example, serialized as one query pair per item.
      tags:
        - parameters
      parameters:
        - name: tags
          in: query
          required: true
          description: String-item array with a multi-element example
          schema:
            type: array
            minItems: 1
            items:
              type: string
            example:
              - urgent
              - needs review
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  args:
                    type: object
                    properties:
                      tags:
                        type: array
                        items:
                          type: string
                  url:
                    type: string
                required:
                  - url
components:
  schemas:
    CliJsonArrayFlagsRequest:
      type: object
      required:
        - labels
        - events
        - channels
      properties:
        labels:
          type: array
          description: String-item array with a multi-element example
          minItems: 1
          items:
            type: string
          example:
            - release candidate
            - nightly
        events:
          type: array
          description: Enum-item array without an example
          minItems: 1
          items:
            type: string
            enum:
              - item.created
              - item.deleted
        channels:
          type: array
          description: Enum-item array whose example is empty
          items:
            type: string
            enum:
              - email
              - sms
          example: []
        aliases:
          type: array
          description: Optional string-item array
          items:
            type: string
