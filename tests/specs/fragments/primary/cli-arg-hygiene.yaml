openapi: 3.1.0
security:
  - apiKeyAuth: []
  - oauth2: []
  - clientCredentials: [read, write]
  - customSchemeAppId: []
  - basicHttp: []
  - accessToken: []
  - {}
paths:
  /anything/cli/argHygiene:
    post:
      operationId: cliArgHygienePost
      description: >-
        CLI argument-hygiene fixture: a query parameter with declared numeric
        bounds, a body string with minLength, an unconstrained body string,
        and an enum body field whose enum is also exposed as a catalog
        command (x-speakeasy-cli-catalog).
      tags:
        - cliHygiene
      parameters:
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: ratio
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CliArgHygieneRequest"
            example:
              code: abc
              label: hello
              model: standard
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  json:
                    $ref: "#/components/schemas/CliArgHygieneRequest"
                  url:
                    type: string
                required:
                  - url
  /anything/cli/argHygieneRequiredString:
    post:
      operationId: cliArgHygieneRequiredStringPost
      description: >-
        A required body string with no length constraint: an explicitly empty
        value is present (the schema allows ""), not missing.
      tags:
        - cliHygiene
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CliArgHygieneRequiredString"
            example:
              tag: hello
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  json:
                    $ref: "#/components/schemas/CliArgHygieneRequiredString"
                  url:
                    type: string
                required:
                  - url
components:
  schemas:
    CliArgHygieneRequiredString:
      type: object
      required:
        - tag
      properties:
        tag:
          type: string
          description: Required tag with no length constraint
    CliArgHygieneRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: Required code; the schema forbids the empty string
          minLength: 1
        label:
          type: string
          description: Optional label with no length constraint (empty is valid)
        schema:
          type: string
          description: Field named after the reserved --schema flag; the CLI must rename its flag to --schema-param
        model:
          $ref: "#/components/schemas/CliHygieneModel"
    CliHygieneModel:
      type: string
      description: Model selection exposed as a catalog listing command
      enum:
        - standard
        - fast
      x-speakeasy-cli-catalog:
        command: hygiene-models
        summary: List hygiene models
        default: standard
