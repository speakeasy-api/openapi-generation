openapi: 3.1.0
security:
  - apiKeyAuth: []
  - oauth2: []
  - clientCredentials: [read, write]
  - customSchemeAppId: []
  - basicHttp: []
  - accessToken: []
  - {}
paths:
  /primary/shadowed-key-parameter:
    get:
      operationId: primaryShadowedKeyParameter
      description: >-
        Tests that an operation with query parameters named "key" and "value" does not cause a Lint/ShadowingOuterLocalVariable RuboCop offense when the http_headers iteration block also uses "key" and "value" as block variables.
      parameters:
        - name: key
          in: query
          required: false
          schema:
            type: string
        - name: value
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
