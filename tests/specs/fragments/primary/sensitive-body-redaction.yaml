openapi: 3.1.0
security:
  - apiKeyAuth: []
  - oauth2: []
  - clientCredentials: [read, write]
  - customSchemeAppId: []
  - basicHttp: []
  - accessToken: []
  - {}
paths:
  /anything/sensitiveBodyRedaction:
    post:
      operationId: sensitiveBodyRedaction
      x-speakeasy-group: sensitiveBodies
      x-speakeasy-name-override: redaction
      description: >-
        Exercises locating values marked sensitive (x-speakeasy-param-sensitive
        or format password) in request and response bodies by schema path, so
        that they can be masked when bodies are logged. Sensitive values appear
        at the top level, in nested objects, in array items, as array items, as
        additionalProperties values beside a declared plain property, in union
        variants, through a recursive schema, and as a whole object. An
        unmarked property sharing a name with a sensitive one stays readable.
        The error response schema also holds a sensitive value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensitiveBodyPayload"
      responses:
        "200":
          description: The payload, including newly returned sensitive values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensitiveBodyPayload"
        "400":
          description: An error whose body holds a sensitive value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensitiveBodyError"
  /anything/sensitiveStreamRedaction:
    get:
      operationId: sensitiveStreamRedaction
      x-speakeasy-group: sensitiveBodies
      x-speakeasy-name-override: streamRedaction
      description: >-
        Exercises a streamed JSON Lines response whose items hold a value marked
        sensitive. A stream body is not parsed item by item, so it is masked as
        a whole when logged.
      responses:
        "200":
          description: A stream of items holding sensitive values.
          content:
            application/jsonl:
              schema:
                $ref: "#/components/schemas/SensitiveBodyNested"
components:
  schemas:
    SensitiveBodyPayload:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        password:
          type: string
          format: password
        token:
          type: string
          x-speakeasy-param-sensitive: true
        nested:
          $ref: "#/components/schemas/SensitiveBodyNested"
        items:
          type: array
          items:
            $ref: "#/components/schemas/SensitiveBodyNested"
        tokens:
          type: array
          items:
            type: string
            x-speakeasy-param-sensitive: true
        labels:
          $ref: "#/components/schemas/SensitiveBodyLabels"
        credential:
          oneOf:
            - $ref: "#/components/schemas/SensitiveBodyAPIKeyCredential"
            - $ref: "#/components/schemas/SensitiveBodyPasswordCredential"
        tree:
          $ref: "#/components/schemas/SensitiveBodyTree"
        whole:
          type: object
          x-speakeasy-param-sensitive: true
          properties:
            value:
              type: string
        unrelated:
          $ref: "#/components/schemas/SensitiveBodyUnrelated"
    SensitiveBodyError:
      type: object
      properties:
        message:
          type: string
        secret:
          type: string
          x-speakeasy-param-sensitive: true
    SensitiveBodyNested:
      type: object
      properties:
        label:
          type: string
        secret:
          type: string
          x-speakeasy-param-sensitive: true
    SensitiveBodyLabels:
      type: object
      properties:
        visible:
          type: string
      additionalProperties:
        type: string
        x-speakeasy-param-sensitive: true
    SensitiveBodyAPIKeyCredential:
      type: object
      required:
        - kind
        - key
      properties:
        kind:
          type: string
          const: api_key
        key:
          type: string
          x-speakeasy-param-sensitive: true
    SensitiveBodyPasswordCredential:
      type: object
      required:
        - kind
        - password
      properties:
        kind:
          type: string
          const: password
        password:
          type: string
          format: password
    SensitiveBodyTree:
      type: object
      properties:
        label:
          type: string
        secret:
          type: string
          x-speakeasy-param-sensitive: true
        children:
          type: array
          items:
            $ref: "#/components/schemas/SensitiveBodyTree"
    SensitiveBodyUnrelated:
      type: object
      properties:
        secret:
          type: string
