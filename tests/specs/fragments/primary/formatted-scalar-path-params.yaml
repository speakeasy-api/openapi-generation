openapi: 3.1.0
security:
  - apiKeyAuth: []
  - oauth2: []
  - clientCredentials: [read, write]
  - customSchemeAppId: []
  - basicHttp: []
  - accessToken: []
  - {}
paths:
  /anything/formattedScalarPathParams/{uuidParam}/{dateTimeParam}/{dateParam}:
    get:
      operationId: formattedScalarPathParams
      tags:
        - parameters
      description: >-
        Tests path parameters whose string formats map to a native scalar type
        rather than a plain string (uuid, date-time, date). Targets that decide
        whether a path parameter is an object by excluding a fixed list of
        primitive types will misclassify these values as objects and fail
        before sending the request. Each value must serialize to its canonical
        string form in the path.
      parameters:
        - name: uuidParam
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: dateTimeParam
          in: path
          required: true
          schema:
            type: string
            format: date-time
        - name: dateParam
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                title: res
                type: object
                properties:
                  url:
                    type: string
                required:
                  - url
