openapi: 3.1.0
security:
  - apiKeyAuth: []
  - oauth2: []
  - clientCredentials: [read, write]
  - customSchemeAppId: []
  - basicHttp: []
  - accessToken: []
  - {}
paths:
  /anything/cli/repeatableFlagExamples:
    post:
      operationId: cliRepeatableFlagExamplesPost
      description: >-
        Array-valued examples on required body properties. String-item and
        enum-item arrays are repeatable inputs, so their examples must render
        one value per element rather than a single JSON-encoded token. A
        number-item array is a single JSON-encoded input.
      tags:
        - requestBodies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CliRepeatableFlagExamplesRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  json:
                    $ref: "#/components/schemas/CliRepeatableFlagExamplesRequest"
                  url:
                    type: string
                required:
                  - url
  /anything/cli/repeatableFlagExamples/query:
    get:
      operationId: cliRepeatableFlagExamplesGet
      description: >-
        Array-valued examples on required query parameters. A string-item
        array parameter is a repeatable input, so its example must render one
        value per element rather than a single JSON-encoded token. An
        integer-item array parameter is a single JSON-encoded input.
      tags:
        - parameters
      parameters:
        - name: tags
          in: query
          required: true
          description: String-item array with a multi-element example
          schema:
            type: array
            minItems: 1
            items:
              type: string
            example:
              - urgent
              - needs review
        - name: ids
          in: query
          required: true
          description: Integer-item array; rendered as one JSON-encoded value
          schema:
            type: array
            minItems: 1
            items:
              type: integer
            example:
              - 1
              - 2
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  args:
                    type: object
                    properties:
                      tags:
                        type: array
                        items:
                          type: string
                      ids:
                        type: array
                        items:
                          type: string
                  url:
                    type: string
                required:
                  - url
components:
  schemas:
    CliRepeatableFlagExamplesRequest:
      type: object
      required:
        - labels
        - events
        - weights
        - channels
      properties:
        labels:
          type: array
          description: String-item array with a multi-element example
          minItems: 1
          items:
            type: string
          example:
            - release candidate
            - owner's pick
        events:
          type: array
          description: Enum-item array without an example; synthesized from the enum
          minItems: 1
          items:
            type: string
            enum:
              - item.created
              - item.deleted
        weights:
          type: array
          description: Number-item array; rendered as one JSON-encoded value
          items:
            type: number
          example:
            - 1.5
            - 2
        channels:
          type: array
          description: >-
            String-item array whose example is empty; the default supplies the
            rendered elements instead
          items:
            type: string
          default:
            - email
          example: []
