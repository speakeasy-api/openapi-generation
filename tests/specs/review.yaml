components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: api_key
      in: header
      x-speakeasy-name-override: MyApiKey  # does not take effect in `SecurityOption2` (AND)
    basicHttp:
      type: http
      scheme: basic
      x-speakeasy-example: <USERNAME>;<PASSWORD>
      x-speakeasy-name-override: UserPassAuth
    bearerAuth:
      type: http
      scheme: bearer
      x-speakeasy-example: <YOUR_JWT>
    oauth2:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: http://localhost:35123/oauth2/authorize
          scopes: {}
      x-speakeasy-example: Bearer <YOUR_OAUTH2_TOKEN>
    mobileAuth:
      type: oauth2
      description: |-
        OAuth2 Password flow, a flow that is too
        long to describe in a single line.
      flows:
        password:
          tokenUrl: http://localhost:35456/oauth2/token
          scopes:
            read: Read your data
            write: Write to your data
      x-speakeasy-example: Bearer <YOUR_OAUTH2_TOKEN>
    clientCredentials:
      type: oauth2
      description: "Client Credentials flow."
      flows:
        clientCredentials:
          tokenUrl: /clientcredentials/token
          x-speakeasy-overridable-scopes: false
          scopes:
            read: Read access
            write: Write access
            unused: |-
              Not only this scope is not used
              but it has a pretty long comment.
    accessToken:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: "https://oauth/auth"
          tokenUrl: "https://oauth/token"
          scopes:
            models:read: Grants read access on models
            store_manage: Allows management operations
            impersonation: ""
    customSchemeAppId:
      type: http
      scheme: custom
      x-speakeasy-custom-security-scheme:
        usesScopes: false
        schema:
          type: object
          properties:
            appId:
              type: string
              example: app-speakeasy-123
            secret:
              type: string
              example: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI
          required:
            - appId
            - secret
  schemas:
    ChatModelRequest:
      type: object
      required: [prompt]
      properties:
        model:
          type: string
          default: review-model
          description: Model to use
        prompt:
          type: string
          example: "What is the largest city in the world?"
        stream:
          type: boolean
          default: true
          description: Stream events as they arrive
        max_tokens:
          type: integer
          description: Maximum number of tokens to generate
        temperature:
          type: number
          description: Sampling temperature
    ChatAgentRequest:
      type: object
      required: [agent, prompt]
      properties:
        agent:
          type: string
        prompt:
          type: string
        stream:
          type: boolean
          default: true
          description: Stream events as they arrive
        max_tokens:
          type: integer
          description: Maximum number of tokens to generate
