    post:
      operationId: testEnumFormats
      summary: Test x-speakeasy-enums in different formats
      description: |-
        This endpoint tests the x-speakeasy-enums extension in both array and map formats,
        including partial map coverage and both string and integer enum types.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stringArrayFormat:
                  type: string
                  description: "String enum with x-speakeasy-enums as array (full coverage)"
                  enum:
                    - pending_review
                    - approved_final
                    - rejected_permanently
                    - arch_x86
                    - mobile_ios
                    - custom_field
                  x-speakeasy-enums:
                    - AwaitingReviewProcess
                    - CompletelyApprovedAndFinalized
                    - PermanentlyRejectedForever
                    - X86_64
                    - iOS_app
                    - my_CUSTOM_name
                  example: pending_review
                stringMapFormat:
                  type: string
                  description: "String enum with x-speakeasy-enums as map (full coverage)"
                  enum:
                    - low_priority
                    - medium_priority
                    - high_priority
                    - critical_urgent
                  x-speakeasy-enums:
                    low_priority: MinimalImportanceLevel
                    medium_priority: ModerateImportanceLevel
                    high_priority: SignificantImportanceLevel
                    critical_urgent: ExtremelyUrgentAndCritical
                  example: medium_priority
                stringPartialMapFormat:
                  type: string
                  description: "String enum with x-speakeasy-enums as map (partial coverage)"
                  enum:
                    - draft_mode
                    - under_review
                    - published_live
                    - archived_old
                  x-speakeasy-enums:
                    draft_mode: InitialDraftVersion
                    published_live: LivePublishedContent
                  example: draft_mode
                integerMapFormat:
                  type: integer
                  description: "Integer enum with x-speakeasy-enums as map (full coverage)"
                  enum:
                    - 100
                    - 200
                    - 300
                    - 400
                  x-speakeasy-enums:
                    100: ContinueProcessingRequest
                    200: SuccessfulOperationComplete
                    300: RedirectToAnotherLocation
                    400: ClientSideErrorOccurred
                  example: 200
                integerPartialMapFormat:
                  type: integer
                  description: "Integer enum with x-speakeasy-enums as map (partial coverage)"
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                    - 5
                  x-speakeasy-enums:
                    1: PrimaryFirstOption
                    3: MiddleThirdChoice
                    5: FinalFifthSelection
                  example: 1
              required:
                - stringArrayFormat
                - stringMapFormat
                - stringPartialMapFormat
                - integerMapFormat
                - integerPartialMapFormat
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Enum formats processed successfully"
                required:
                  - message
