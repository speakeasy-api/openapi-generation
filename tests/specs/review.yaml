openapi: 3.1.0
info:
  title: SDK Review
  version: 0.1.0
  summary: A test document for reviewing the SDK.
  description: |-
    This document will show case as many of our features as possible in as little operations/models as possible.
    This will then generate a SDK that we can more easily review than the test SDKs based on uber.yaml spec.
externalDocs:
  url: https://speakeasy.com/docs
  description: Speakeasy Docs
servers:
  - url: http://localhost:35123
    description: The default server.
  - url: http://{subdomain}.domain.com/v{version}
    # a server with no descriptions
    variables:
      subdomain:
        default: "api"
      version:
        default: "1"
  - url: http://{HostName}:{PORT}
    description: A server with an enum variable.
    variables:
      HostName:
        default: localhost
        description: The hostname of the server.
      PORT:
        enum:
          - "80"
          - "8080"
          - "443"
        default: "8080"
        description: The port on which the server is running.
# Declared error conventions for the review CLI: every x-speakeasy-cli-errors
# surface is exercised — a detail-style primary carrier (reasonPointer), an
# additional status-style probe, the single-element error-array unwrap, typed
# and hint rules, and declared account-state types with their own hints.
x-speakeasy-cli-errors:
  version: 1
  reasonPointer: $.details[*].reason
  unwrapErrorArray: true
  reasons:
    ACCOUNT_KEY_REVOKED:
      type: authentication_error
      hints: Replace the revoked account key before retrying
    ACCOUNT_SERVICE_PAUSED:
      type: service_disabled
    ACCOUNT_BILLING_PAUSED:
      type: billing_disabled
    CLI_PROTOCOL:
      hints: Report the response payload and CLI version to the API operator
  probes:
    - pointer: $.status
      reasons:
        ACCESS_DENIED:
          type: authorization_error
  types:
    service_disabled:
      hints: Ask the account owner to resume this service before retrying
    billing_disabled:
      hints: Restore billing for the account before retrying
x-speakeasy-globals:
  parameters:
    - name: queryParam1
      description: |
        A long winded, multi-line description
        for the query parameter number one.
      in: query
      required: true
      schema:
        type: string
        example: "some example query param"
    - name: deprecatedQueryParam1
      in: query
      description: A deprecated description
      deprecated: true
      schema:
        type: string
        example: "some example query param"
    - name: deprecatedQueryParam2
      in: query
      required: true
      deprecated: true
      schema:
        type: string
        example: "some example query param"
    - $ref: "#/components/parameters/loneQueryParam"
x-speakeasy-name-override:
  - operationId: postTest2
    methodNameOverride: postTest
tags:
  - name: tag1
    description: The first tag.
    x-speakeasy-docs:
      go:
        description: Testing for documentation extensions in Go.
      python:
        description: Testing for documentation extensions in Python.
      typescript:
        description: Testing for documentation extensions in TypeScript.
  - name: obsolete
    description: A subSDK in which all operations are deprecated.
security:
  - basicHttp: []
  - bearerAuth: []
    apiKey: []
  - oauth2: []
  - customSchemeAppId: []
  - mobileAuth: [read]
  - clientCredentials: [read]
  - apiKey: []
  - {}
x-speakeasy-cli-commands:
  version: 1
  categories: [Create, Manage]
  commands:
    invite:
      category: Create
      summary: Invite a user by email
      description: |-
        Create a user record from an email address. Full request control:
        "cli create-user".
      op: createUser
      args:
        email:
          to: $.email
          variadic: true
          summary: Email address to invite
      flags:
        given-name:
          to: $.first_name
          summary: First name to record
        user-gender:
          to: $.gender
          summary: Gender to record
      preset:
        $.associatedIds: seed-user
      hints:
        CLI_VALIDATION: Print the exact request schema with --schema
      examples:
        basic:
          summary: Invite by email
          command: cli invite someone@example.com
        named: cli invite someone@example.com --given-name John
      jq: .id
    enroll:
      category: Manage
      summary: Enroll a user by email
      op: createUser
      flags:
        enrollment-email:
          to: $.email
          required: true
          summary: Email address to enroll
      examples:
        basic: cli enroll --enrollment-email someone@example.com
    tag1 recent:
      category: Manage
      summary: List recent test1 pages via tag1
      op: listTest1
    render:
      category: Create
      summary: Render an image asset to a file
      help:
        defaults: output_modalities image
        learn: cli docs render
        escalate: full request control via cli render-asset
      description: |-
        Render an image from a text prompt and write it to a file; stdout
        carries the file path. Full request control: "cli render-asset".
      op: renderAsset
      args:
        prompt:
          to: $.prompt
          variadic: true
          summary: Text prompt to render
      preset:
        $.output_modalities: image
      output:
        artifact:
          contentPointer: $.steps[*].content[*]
          kind: image
          defaultPath: "render-{timestamp}-{rand}.{ext}"
      examples:
        basic: cli render "a lighthouse at sunset"
    produce:
      category: Create
      summary: Produce an image asset and wait for completion
      description: |-
        Start an asset job, poll it to a terminal state, and write the image
        to a file. Use --async to return only the operation handle.
      op: renderAsset
      args:
        prompt:
          to: $.prompt
          variadic: true
          summary: Text prompt to render
      preset:
        $.output_modalities: image
      async:
        op: getAsset
        id:
          from: $.id
          to: {in: path, name: id}
        params:
          stream: false
        statePointer: $.status
        states:
          in_progress: pending
          completed: success
          failed: failure
          requires_action: handoff
        interval: 20ms
        backoff: 1.5
        maxInterval: 60ms
        timeout: 5s
      output:
        artifact:
          contentPointer: $.steps[*].content[*]
          kind: image
          defaultPath: "produce-{timestamp}-{rand}.{ext}"
      hints:
        CLI_ASYNC_FAILED: Inspect the terminal response and resume command
        CLI_ASYNC_TIMEOUT: Resume polling with the returned handle
        CLI_ASYNC_UNKNOWN_STATE: Regenerate the CLI against the current API schema
      examples:
        basic: cli produce "a lighthouse at sunrise"
    observe:
      category: Manage
      summary: Produce an asset and print its terminal status
      op: renderAsset
      args:
        prompt:
          to: $.prompt
          variadic: true
          summary: Text prompt to render
      preset:
        $.output_modalities: image
      async:
        op: getAsset
        id:
          from: $.id
          to: {in: path, name: id}
        params:
          stream: false
        statePointer: $.status
        states:
          in_progress: pending
          completed: success
          failed: failure
          requires_action: handoff
        interval: 20ms
        backoff: 1.5
        maxInterval: 60ms
        timeout: 5s
      jq: .status
    say:
      category: Create
      summary: Stream a chat reply
      description: |-
        Send a prompt and print the reply as it streams. Full request
        control: "cli chat".
      op: chat#ChatModelRequest
      args:
        prompt:
          to: $.prompt
          variadic: true
          summary: Prompt to send
      preset:
        $.stream: true
      flags:
        stream:
          to: $.stream
          type: bool
          defaultFrom: schema
          summary: Stream events as they arrive
      output:
        stream:
          select: $.data.content
      examples:
        basic: cli say "hello there"
    archive:
      category: Manage
      summary: Archive a user account
      planned: >-
        "archive" needs an account-lifecycle API surface that is not part of
        this build. Meanwhile use "cli delete-user".
    test-group: {category: Manage, group: true}
  operations:
    chat:
      output:
        stream:
          select: $.data.content
      flags:
        stream:
          to: $.stream
          type: bool
          default: true
          summary: Stream events as they arrive
        max-tokens:
          to: $.max_tokens
          summary: Maximum number of tokens to generate
        temperature:
          to: $.temperature
          summary: Sampling temperature
paths:
  /deprecated:
    get:
      operationId: deprecated1
      tags:
        - tag1
        - obsolete
      summary: Deprecated Operation
      deprecated: true
      x-speakeasy-deprecation-message: This endpoint is deprecated.
      x-speakeasy-deprecation-replacement: getRequestBodyFlattenedAway
      servers:
        - url: http://localhost:12345
          description: A deprecated server
      responses:
        "200":
          description: OK
  /auth:
    get:
      operationId: auth
      description: |
        This operation aims at testing available OAuth2 scopes collection:
         - only operation with oauth2 authorizationCode security flow
         - belongs to a subSDK
      security:
        - accessToken: [impersonation]
      tags:
        - tag1
      x-speakeasy-errors:
        statusCodes:
          - 401
          - 500
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
        "403":
          description: Forbidden
  /test_operation_id_with_underscores:
    get:
      parameters:
        - name: queryParam1
          in: query
          required: true
          schema:
            type: string
          x-speakeasy-name-override: qp1
          example: "renamed"
          description: >-
            This parameter will not be filled in with the queryParam1 global
            because it uses x-speakeasy-name-override which results in a
            non-matching name.
      operationId: _operation_with_leading_and_trailing_underscores_
      x-speakeasy-name-override: _operation_with_leading_and_trailing_underscores_
      x-speakeasy-errors:
        statusCodes:
          - "default"
          - "3XX"
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
        "5XX":
          description: Server Error
  /test1/{page}:
    get:
      operationId: listTest1
      tags:
        - tag1
      summary: Get Test1
      description: |-
        This is a {{test}} endpoint.
        It has a description.
      x-speakeasy-timeout: 50000
      x-speakeasy-usage-example:
        title: "A custom readme heading"
        description: "A custom usage description"
        position: 2
        tags:
          - usage
          - pagination
      x-speakeasy-docs-rate-limits:
        - strategy: sliding_window
          sliding_window:
            rate: 3
            period: second
          identifier: appID
          description: Rate Limit 1 Description
        - strategy: sliding_window
          sliding_window:
            rate: 100
            period: minute
          identifier: IP Address
          description: Rate Limit 2 Description
      security:
        - apiKey: []
        - clientCredentials: [read, write]
      servers:
        - url: http://localhost:35123
          description: The only server.
          x-speakeasy-server-id: Main
      x-speakeasy-pagination:
        type: offsetLimit
        inputs:
          - name: page
            in: parameters
            type: page
        outputs:
          results: $.resultArray
      parameters:
        - name: queryParam1
          in: query
          required: true
          schema:
            type: string
            example: "some {{example}} query param"
        - name: queryParam2
          description: |-
            An [enum](https://enum.com) "query parameter"
            that is not easily described in a single line.

            **Available Values:**
            | Value | Description |
            |-------|-------------|
            | 0     | No data     |
            | 1     | Partial     |
            | 2     | Complete    |
          in: query
          required: true
          schema:
            type: integer
            enum: [0, 1, 2]
            x-speakeasy-enum-descriptions:
              - No additional data returned
              - Partial data set returned
              - Complete data set returned
            example: 1
        - name: page
          in: path
          required: true
          schema:
            type: integer
            example: 100
        - name: headerParam1
          in: header
          required: true
          schema:
            type: string
            example: "some example header param"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultArray:
                    type: array
                    items:
                      type: object
                      properties:
                        test1:
                          type: string
                          example: "some example response"
                      required:
                        - test1
                  totalCount:
                    type: integer
                    example: 100
                  type:
                    $ref: "#/components/schemas/Enum"
                required:
                  - resultArray
                  - totalCount
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /test2:
    post:
      operationId: postTest2
      summary: Post Test2
      x-speakeasy-deprecated: true
      x-speakeasy-group:
        - testGroup.tag2
        - testGroup.tag3
      x-speakeasy-usage-example: true
      description: |-
        This is a test endpoint.
        It has a description.
      security:
        - apiKey: [ ]
      parameters:
        - name: deprecatedQueryParam1
          in: query
          deprecated: true
          schema:
            type: string
            example: "some {{example}} query param"
        - name: deprecatedQueryParam2
          in: query
          deprecated: true
          required: true
          schema:
            type: string
            example: "some {{example}} query param"
      servers:
        - url: http://localhost:35123
          description: The default server.
          x-speakeasy-server-id: default
        - url: http://{hostname}:{port}
          description: A server url with templated variables.
          variables:
            port:
              default: "35123"
              description: The port on which the server is running.
            hostname:
              default: localhost
              description: The hostname of the server.
          x-speakeasy-server-id: templatable
      requestBody:
        $ref: "#/components/requestBodies/Test2Request"
      responses:
        "200":
          description: OK
          content:
            multipart/form-data:
              schema:
                $ref: "#/components/schemas/Test2Response"
        default:
          description: successful operation
        "400":
          $ref: "#/components/responses/BadRequestResponse"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Test2Response"
      x-speakeasy-retries:
        strategy: backoff
        backoff:
          initialInterval: 10 # 10 ms
          maxInterval: 200 # 200 ms
          maxElapsedTime: 1000 # 1 seconds
          exponent: 1.5
        statusCodes:
          - 404
        retryConnectionErrors: false
  /file:
    post:
      operationId: postFile
      summary: Post File
      description: |-
        This is a test endpoint.
        It has a description.
      x-speakeasy-usage-example:
        tags:
          - usage
          - security
          - server
          - retries # ignored since endpoint does not support retries
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  x-speakeasy-name-override: upload
                  $ref: "#/components/schemas/File"
              required:
                - file
        required: true
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/File"
        "415":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "4XX":
          description: Client Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "5XX":
          description: Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /fileWithEncoding:
    post:
      operationId: postFileWithEncoding
      summary: Post File With Encoding
      description: |-
        This endpoint tests the encoding field with multipart/form-data content type.
        According to OpenAPI 3.0.3 spec, the encoding field is valid for both
        application/x-www-form-urlencoded and multipart/* media types.

        This test includes multiple content types for the file field to verify
        handling of comma-separated content types in encoding.
      tags:
        - tag1
      x-speakeasy-usage-example:
        tags:
          - usage
          - file-upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload (supports CSV, PNG, JPEG, or PDF)
                attachment:
                  type: string
                  format: binary
                  description: An optional binary attachment
                fileName:
                  type: string
                  description: Optional custom file name
                filePurpose:
                  type: string
                  description: Purpose of the file upload
                metadata:
                  type: object
                  description: JSON metadata about the file
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    tags:
                      type: array
                      items:
                        type: string
              required:
                - file
            encoding:
              file:
                contentType: text/csv, image/png, image/jpeg, application/pdf
              attachment:
                contentType: application/octet-stream
              filePurpose:
                contentType: text/plain
              metadata:
                contentType: application/json
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileName:
                    type: string
                  size:
                    type: integer
                  contentType:
                    type: string
                  metadata:
                    type: object
                    additionalProperties: true
                required:
                  - fileName
                  - size
        "415":
          description: File too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /polymorphism:
    get:
      operationId: getPolymorphism
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  oneOfWithUnionDescription:
                    description: "A union of two types."
                    oneOf:
                      - $ref: "#/components/schemas/ExhaustiveObject"
                      - $ref: "#/components/schemas/SimpleObject"
                    x-some-extension: "doesn't interfere with type generation"
                  oneOfWithFactoredOutProperties:
                    $ref: "#/components/schemas/OneOfWithFactoredOutProperties"
                  simpleAllOf:
                    allOf:
                      - type: object
                        properties:
                          str:
                            type: string
                            description: "A string property."
                            example: "example"
                      - type: object
                        properties:
                          bool:
                            type: boolean
                            description: "A boolean property."
                            example: true
                  allOfWithFactoredOutProperties:
                    description: "An object with allOf and factored out properties."
                    properties:
                      anExtraProperty:
                        type: string
                        description: "An extra property."
                        example: "example"
                      anOverridingProperty:
                        type: string
                        description: "An overriding property."
                        example: "example"
                    allOf:
                      - type: object
                        properties:
                          anOverridingProperty:
                            type: integer
                            description: "An overriding property."
                            example: 1
                      - type: object
                        properties:
                          anOverridingProperty:
                            type: number
                            description: "An overriding property."
                            example: 1.1
                          anotherProperty:
                            type: string
                            description: "Another property."
                            example: "example"
                  circularUnion:
                    $ref: "#/components/schemas/CircularUnion"
                  recursiveFormField:
                    $ref: "#/components/schemas/RecursiveFormField"
  /unionErrors:
    get:
      operationId: getUnionErrors
      x-speakeasy-usage-example:
        tags:
          - errors
      x-speakeasy-pagination:
        type: offsetLimit
        inputs:
          - name: page
            in: parameters
            type: page
        outputs:
          results: $.pages
      x-speakeasy-react-hook:
        disabled: true
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
          example: 12
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pages:
                    type: array
                    items:
                      type: string
                required:
                  - pages
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "4XX":
          description: Something went wrong
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TaggedError1"
                  - $ref: "#/components/schemas/TaggedError2"
                discriminator:
                  propertyName: tag
                  mapping:
                    tag1: "#/components/schemas/TaggedError1"
                    tag2: "#/components/schemas/TaggedError2"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorType1"
                  - $ref: "#/components/schemas/ErrorType2"
  /requestBodyFlattenedAway:
    get:
      operationId: getRequestBodyFlattenedAway
      parameters:
        - $ref: "#/components/parameters/loneQueryParam"
      responses:
        "200":
          description: OK
  /fullyFlattenedRequest:
    post:
      operationId: getFullyFlattenedRequest
      security:
        - clientCredentials: []
        - apiKey: []
        - {}
      x-speakeasy-flatten-request: true
      x-speakeasy-react-hook:
        type: query
        name: FlatRequest
      parameters:
        - name: lang
          in: query
          required: true
          schema:
            type: string
          examples:
            namedExampleThatIsntMatchedAcrossDifferentExamples:
              value: "en"
        - name: max_length
          in: query
          required: false
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                emoji:
                  type: string
                  enum: [wave, smiley, thumbsup, tada]
                  x-speakeasy-enum-descriptions:
                    wave: |
                      A short greeting wave emoji
                      This value is often used for friendly acknowledgements.
                    smiley: A classic smiling face
                    thumbsup: |
                      Indicates approval
                      The receiving system may treat this as a positive affirmation.
                    tada: Celebration emoji with confetti
                gif:
                  type: string
                reply:
                  type: boolean
                private:
                  type: boolean
        required: true
      responses:
        "200":
          description: OK
  /unionRequestBody:
    post:
      operationId: createWithUnion
      summary: Create with discriminated union request body
      description: Test CLI generation for discriminated unions with dot-notation flags
      x-speakeasy-flatten-request: true
      parameters:
        - name: dryRun
          in: query
          schema:
            type: boolean
          description: If true, validates without creating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShapeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  shape:
                    $ref: "#/components/schemas/Shape"
  /test/endpoint/{testName}:
    post:
      operationId: testEndpoint
      parameters:
        - name: testName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                test:
                  type: string
              required:
                - test
        required: true
      responses:
        "200":
          description: OK
  /user:
    put:
      operationId: createUser
      summary: Create User
      description: |
        Creates a new user in the system. Multiple named examples demonstrate
        different pairing scenarios for documentation generation.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaseUser"
            examples:
              request-only:
                summary: Request example without matching response
                value:
                  email: "request-only@example.com"
              paired-example:
                summary: Request example with matching response
                value:
                  email: "paired@example.com"
                  first_name: "John"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                paired-example:
                  summary: Response example with matching request
                  value:
                    id: "user-paired"
                    email: "paired@example.com"
                    first_name: "John"
                response-only:
                  summary: Response example without matching request
                  value:
                    id: "user-response"
                    email: "response-only@example.com"
  /user/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getUser
      summary: Get User
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
