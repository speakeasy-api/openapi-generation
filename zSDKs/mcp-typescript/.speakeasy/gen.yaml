configVersion: 2.0.0
generation:
  sdkClassName: SDK
  maintainOpenAPIOrder: true
  usageSnippets:
    optionalPropertyRendering: withExample
    sdkInitStyle: constructor
  nameResolution: shortest
  fixes:
    nameResolutionDec2023: true
    nameResolutionFeb2025: true
    parameterOrderingFeb2024: false
    requestResponseComponentNamesFeb2024: true
    securityFeb2025: true
    sharedErrorComponentsApr2025: false
    sharedNestedComponentsJan2026: false
    nameOverrideFeb2026: true
  auth:
    oAuth2ClientCredentialsEnabled: false
    oAuth2PasswordEnabled: false
    hoistGlobalSecurity: true
  schemas:
    allOfMergeStrategy: shallowMerge
  requestBodyFieldName: ""
  versioningStrategy: automatic
  persistentEdits: {}
  tests:
    generateTests: true
    generateNewTests: false
    skipResponseBodyAssertions: false
  repoUrl: https://github.com/speakeasy-sdks/test-sdk
mcp-typescript:
  version: 0.0.1
  additionalDependencies:
    dependencies: {}
    devDependencies: {}
    peerDependencies: {}
  advancedFlags:
    - loneQueryParam
  author: Speakeasy
  baseErrorName: SDKError
  cloudflareEnabled: true
  cloudflareURL: https://openapi-mcp-server.example.workers.dev
  customCasings:
    mcp:
      initialism: true
  defaultErrorName: SDKDefaultError
  envVarPrefix: SPK
  evalProvider: openai
  fixEnumNameSanitization: true
  formStringArrayEncodeMode: encoded-string
  gramEnabled: true
  inferUnionDiscriminators: true
  inputModelSuffix: input
  maxMethodParams: 0
  mcpName: io.github.speakeasy-api/openapi-server
  mcpbManifestOverlay:
    keywords:
      - custom
      - added
      - keywords
    user_config:
      overlay_param1:
        description: Description of overlayParam1
        required: false
        title: overlayParam1
        type: string
  multipartArrayFormat: standard
  outputModelSuffix: output
  packageName: openapi
  responseFormat: envelope
  validateResponse: false
