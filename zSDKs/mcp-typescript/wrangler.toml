
name = "openapi-mcp-server"
main = "src/cloudflare-worker/cloudflare-worker.ts"
compatibility_date = "2025-07-15"

# Enable node compatibility for MCP SDK
compatibility_flags = ["nodejs_compat", "enable_request_signal"]

# Retained so existing deployments keep their Durable Object namespace and stored state
[[durable_objects.bindings]]
name = "OPENAPI_MCP"
class_name = "OpenapiMCP"

[[migrations]]
tag = "v1"
new_classes = ["OpenapiMCP"]

# Static assets configuration
[assets]
directory = "./static"
binding = "ASSETS"
run_worker_first = true

# Development configuration
[dev]
port = 8787